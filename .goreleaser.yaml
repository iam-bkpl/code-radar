version: 2

project_name: code-radar

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: code-radar
    main: .
    binary: code-radar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: code-radar
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - repository:
      owner: iam-bkpl
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/iam-bkpl/code-radar"
    description: "Track where your git commits have been deployed across branches"
    license: "MIT"
    skip_upload: auto
    test: |
      system "#{bin}/code-radar", "--help"
    install: |
      bin.install "code-radar"

release:
  github:
    owner: iam-bkpl
    name: code-radar
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## What's New
    
    For detailed changelog, see [CHANGELOG.md](https://github.com/iam-bkpl/code-radar/blob/main/CHANGELOG.md)
  footer: |
    ---
    **Full Changelog**: https://github.com/iam-bkpl/code-radar/compare/{{ .PreviousTag }}...{{ .CurrentTag }}
